<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Haddonfield Halloween — play the featured video.">
  <title>Haddonfield Halloween</title>
  <style>
    :root { color-scheme: dark; --orange: #f27b21; --ink: #101014; --paper: #f4eee6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; background: radial-gradient(ellipse at center, #34211b 0, var(--ink) 70%); color: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
    .screen { width: min(1050px, 100%); }
    .cover { position: relative; display: grid; place-items: center; min-height: min(72vh, 590px); overflow: hidden; text-align: center; border: 1px solid #704323; background: linear-gradient(180deg, #09080a44, #09080acc), url('https://img.youtube.com/vi/HdT9OQlxW9E/hqdefault.jpg') center / cover no-repeat; box-shadow: 0 25px 90px #000b; }
    .cover-content { position: relative; max-width: 760px; padding: 2rem; }
    .eyebrow { color: #ffb267; text-transform: uppercase; letter-spacing: .3em; font: 700 .76rem/1.5 Arial, sans-serif; }
    h1 { margin: 1rem 0; font-size: clamp(2.8rem, 9vw, 6.8rem); line-height: .9; text-transform: uppercase; text-shadow: 0 4px 30px #000; }
    .subtitle { color: #eee1d4; font: 1rem/1.6 Arial, sans-serif; }
    .play-button { display: inline-flex; align-items: center; gap: .75rem; margin-top: 1.4rem; padding: 1rem 1.5rem; border: 0; border-radius: 3px; background: #d84c19; color: white; cursor: pointer; text-transform: uppercase; letter-spacing: .12em; font: 700 .9rem Arial, sans-serif; }
    .play-button:hover, .play-button:focus-visible { background: var(--orange); }
    .play-icon { font-size: 1.2rem; }
    .player { display: none; width: 100%; aspect-ratio: 16 / 9; background: #000; box-shadow: 0 25px 90px #000b; }
    .player iframe { display: block; width: 100%; height: 100%; border: 0; }
    .fallback { margin: 1rem 0 0; text-align: center; color: #c9c0b8; font: .9rem/1.6 Arial, sans-serif; }
    .fallback a { color: #ffb267; }
    footer { padding: 1.25rem 0 0; text-align: center; color: #9c9189; font: .75rem Arial, sans-serif; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="screen">
    <section class="cover" id="cover" aria-label="Haddonfield Halloween video cover">
      <div class="cover-content">
        <div class="eyebrow">A Halloween feature</div>
        <h1>Haddonfield<br>Halloween</h1>
        <p class="subtitle">Press play to watch the video.</p>
        <button class="play-button" id="play" type="button"><span class="play-icon" aria-hidden="true">▶</span> Play video</button>
      </div>
    </section>
    <div class="player" id="player" aria-label="Video player"></div>
    <p class="fallback" id="fallback" hidden>Having trouble playing it here? <a href="https://www.youtube.com/watch?v=HdT9OQlxW9E" target="_blank" rel="noopener noreferrer">Watch the video directly on YouTube</a>.</p>
    <footer>Haddonfield Halloween</footer>
  </main>
  <script>
    document.getElementById('play').addEventListener('click', function () {
      const frame = document.createElement('iframe');
      frame.src = 'https://www.youtube.com/embed/HdT9OQlxW9E?autoplay=1&rel=0';
      frame.title = 'Haddonfield Halloween video';
      frame.allow = 'autoplay; encrypted-media; picture-in-picture; web-share';
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.allowFullscreen = true;
      document.getElementById('cover').hidden = true;
      document.getElementById('player').appendChild(frame);
      document.getElementById('player').style.display = 'block';
      document.getElementById('fallback').hidden = false;
    });
  </script>
</body>
</html>
